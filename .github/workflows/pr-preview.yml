name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel an in-progress run when a new commit is pushed to the same PR —
# the latest commit is the one worth previewing.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  preview:
    name: Build, preview, comment URL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pin to 20. Astro 5.x supports it. We deliberately do NOT set
          # cache: "npm" — actions/setup-node's cache restore is a cited
          # contributor to the npm "Exit handler never called!" bug we
          # hit in earlier attempts on this branch.
          node-version: "20"

      - name: Install dependencies
        # --ignore-scripts is the actual fix. Without it, workerd's
        # postinstall (transitive via @wix/cloud-provider-fetch-adapter →
        # @astrojs/cloudflare → wrangler) downloads a ~30MB native binary
        # and exits in a way that triggers npm/cli#8203 ("Exit handler
        # never called!"). The exit handler is what wires up
        # node_modules/.bin/* symlinks — skip it and the local binaries
        # never appear, so the next step can't find ./node_modules/.bin/astro.
        #
        # We don't actually run workerd at build time (it's the runtime
        # Wix uses for prod hosting), so skipping its postinstall is safe.
        # esbuild's postinstall picks the platform-specific binary it
        # needs at build time; we restore that explicitly below.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild esbuild's platform binary
        # esbuild ships per-platform binaries via optionalDependencies;
        # its postinstall picks the right one. We skipped it above, so
        # rebuild it explicitly. Astro/Vite need this to compile.
        run: npm rebuild esbuild

      - name: Type check
        # Use the local binary directly so a flaky `npm ci` can't silently
        # fall back to npx-installing a newer astro than package.json pins.
        run: ./node_modules/.bin/astro check

      - name: Authenticate to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::WIX_API_KEY secret is not set on this repository."
            exit 1
          fi
          ./node_modules/.bin/wix login --api-key "$WIX_API_KEY"

      - name: Build project
        run: ./node_modules/.bin/wix build

      - name: Create preview deployment
        id: preview
        run: |
          # `wix preview` prints a unique preview URL on success.
          OUTPUT=$(./node_modules/.bin/wix preview 2>&1)
          echo "$OUTPUT"

          # Extract the first HTTPS URL from the output — Wix prints the
          # site preview link with a https://...wix... domain.
          URL=$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[A-Za-z0-9._/?=#%&+-]+' | grep -i 'wix' | head -1)

          if [ -z "$URL" ]; then
            echo "::error::Could not extract preview URL from 'wix preview' output."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKER='<!-- rck:pr-preview -->'
          SHORT_SHA="${PR_SHA:0:7}"
          BODY=$(cat <<EOF
          $MARKER
          ## Preview deployment

          **Preview URL:** $PREVIEW_URL

          - Commit: \`$SHORT_SHA\`
          - Generated by \`wix preview\` — unique snapshot for this PR. Does not affect production.
          - Re-runs automatically on every new commit pushed to this PR.
          EOF
          )

          # Find an existing preview comment by marker so we update in place
          # instead of spamming a new comment on every push.
          EXISTING_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | head -1)

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/issues/comments/$EXISTING_ID" \
              -f body="$BODY" > /dev/null
            echo "Updated existing preview comment ($EXISTING_ID)."
          else
            gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$BODY" > /dev/null
            echo "Posted new preview comment."
          fi
