name: Weekly davening flier

# Runs every Sunday 03:05 UTC — 06:05 in Israel on summer clock, 05:05 on
# winter clock. Change the times below if you want it earlier or later.
on:
  schedule:
    - cron: "5 3 * * 0"
  workflow_dispatch: {}

jobs:
  flier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Playwright is installed here, so nothing in the repo's package.json changes.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render the flier
        run: node automation/render.mjs

      # Keeps a copy in the Actions run for 90 days — the backup path when
      # nobody's Mac ran the local launchd schedule that week.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daven-flier
          path: automation/out/*
